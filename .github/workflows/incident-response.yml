# Agentic Incident Response Workflow — Boulder 3
# This workflow simulates automated incident response
# Thomas no longer needs to search for page 47 of the runbook at 2am

name: Incident Response — Agentic Workflow

on:
  # Manual trigger for the demo (workflow_dispatch)
  workflow_dispatch:
    inputs:
      alert_type:
        description: "Type of detected alert"
        required: true
        type: choice
        options:
          - latency_spike
          - error_rate
          - memory_leak
        default: latency_spike
      service_name:
        description: "Affected service"
        required: true
        default: "api-production"
      severity:
        description: "Severity"
        required: true
        type: choice
        options:
          - P1-Critical
          - P2-High
          - P3-Medium
        default: P2-High

  # Can also be triggered by a monitoring webhook (Azure Monitor, Datadog, etc.)
  repository_dispatch:
    types: [monitoring-alert]

jobs:
  incident-response:
    name: Automated Incident Response
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # STEP 1 — DETECT
      # Capture and display the alert details
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Detect — Capture alert details
        id: detect
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "INCIDENT DETECTED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Alert type  : ${{ github.event.inputs.alert_type }}"
          echo "Service     : ${{ github.event.inputs.service_name }}"
          echo "Severity    : ${{ github.event.inputs.severity }}"
          echo "Timestamp   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Triggered by: ${{ github.actor }}"
          echo ""
          echo "alert_type=${{ github.event.inputs.alert_type }}" >> $GITHUB_OUTPUT
          echo "service_name=${{ github.event.inputs.service_name }}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # STEP 2 — CORRELATE
      # Fetch recent git context to identify the probable cause
      # What Thomas used to do manually in 30 min: "what changed?"
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Correlate — Fetch recent changes
        id: correlate
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Correlate — Analyze recent commits
        id: commits
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "CORRELATION — Recent changes"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Last 3 commits:"
          git log --oneline -3 --format="  %h - %s (%an, %ar)"

          LAST_COMMIT=$(git log -1 --format="%H")
          LAST_COMMIT_MSG=$(git log -1 --format="%s")
          LAST_COMMIT_AUTHOR=$(git log -1 --format="%an")
          LAST_COMMIT_TIME=$(git log -1 --format="%ar")

          echo ""
          echo "Most recent probable deployment:"
          echo "  SHA    : $LAST_COMMIT"
          echo "  Message: $LAST_COMMIT_MSG"
          echo "  Author : $LAST_COMMIT_AUTHOR"
          echo "  When   : $LAST_COMMIT_TIME"

          echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT
          echo "last_commit_msg=$LAST_COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "last_commit_author=$LAST_COMMIT_AUTHOR" >> $GITHUB_OUTPUT

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # STEP 3 — DIAGNOSE
      # Generate a structured diagnosis based on the alert type
      # Replaces the 47-page runbook
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Diagnose — Generate incident diagnosis
        id: diagnose
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "AUTOMATED DIAGNOSIS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          ALERT_TYPE="${{ github.event.inputs.alert_type }}"
          SERVICE="${{ github.event.inputs.service_name }}"

          case "$ALERT_TYPE" in
            latency_spike)
              DIAGNOSIS="Latency spike detected on $SERVICE. Analysis: p99 jumped from ~200ms to >4000ms in the last 15 minutes. Probable correlation with the last deployment. Possible causes: (1) unoptimized SQL query, (2) cold start after restart, (3) slow external dependency."
              CONFIDENCE="87%"
              ROOT_CAUSE="Probable performance regression introduced in the latest commit"
              ;;
            error_rate)
              DIAGNOSIS="High error rate on $SERVICE. Analysis: 5xx error rate jumped from 0.1% to 12% in 5 minutes. Correlation with recent deployment SHA. Possible causes: (1) unhandled exception in new code, (2) missing environment variable, (3) database schema incompatibility."
              CONFIDENCE="92%"
              ROOT_CAUSE="Unhandled exception likely related to the recent code change"
              ;;
            memory_leak)
              DIAGNOSIS="Memory leak detected on $SERVICE. Analysis: memory usage increasing at ~50MB/min with no plateau. Pattern consistent with a DB connection leak or unreleased objects. Service restart urgently recommended."
              CONFIDENCE="78%"
              ROOT_CAUSE="Possible memory leak — unclosed DB connections or unregistered listeners"
              ;;
          esac

          echo "Diagnosis   : $DIAGNOSIS"
          echo "Confidence  : $CONFIDENCE"
          echo "Root cause  : $ROOT_CAUSE"

          echo "diagnosis=$DIAGNOSIS" >> $GITHUB_OUTPUT
          echo "confidence=$CONFIDENCE" >> $GITHUB_OUTPUT
          echo "root_cause=$ROOT_CAUSE" >> $GITHUB_OUTPUT

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # STEP 4 — REMEDIATE
      # Determine and display the recommended action
      # Thomas no longer has to decide alone at 2am
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Remediate — Determine recommended action
        id: remediate
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "RECOMMENDED ACTION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          ALERT_TYPE="${{ github.event.inputs.alert_type }}"

          case "$ALERT_TYPE" in
            latency_spike)
              ACTION="ROLLBACK — Revert to the previous commit. Command: git revert ${{ steps.commits.outputs.last_commit }} && git push origin main"
              ACTION_TYPE="rollback"
              URGENCY="Immediate (< 5 min)"
              ;;
            error_rate)
              ACTION="ROLLBACK — Deploy the previous version via Azure App Service deployment slots. Azure CLI: az webapp deployment slot swap --name ${{ github.event.inputs.service_name }}"
              ACTION_TYPE="rollback"
              URGENCY="Immediate (< 10 min)"
              ;;
            memory_leak)
              ACTION="RESTART + SCALE-OUT — Restart the service and increase instance count during investigation. Commands: az webapp restart + az appservice plan update --number-of-workers 3"
              ACTION_TYPE="restart-scale"
              URGENCY="Urgent (< 15 min)"
              ;;
          esac

          echo "Action      : $ACTION"
          echo "Type        : $ACTION_TYPE"
          echo "Urgency     : $URGENCY"

          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "action_type=$ACTION_TYPE" >> $GITHUB_OUTPUT
          echo "urgency=$URGENCY" >> $GITHUB_OUTPUT

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # STEP 5 — REPORT
      # Automatically create a GitHub Issue with the full incident report
      # What Thomas used to write manually in 45 min after the incident
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Report — Create incident GitHub Issue
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "CREATING INCIDENT REPORT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          ALERT_TYPE="${{ github.event.inputs.alert_type }}"
          SERVICE="${{ github.event.inputs.service_name }}"
          SEVERITY="${{ github.event.inputs.severity }}"

          # Format the incident report
          ISSUE_BODY=$(cat <<EOF
          ## Incident Report — ${ALERT_TYPE} on ${SERVICE}

          > **Automatically generated by the Agentic Incident Response workflow**
          > *This report would have taken Thomas 2 hours to write manually at 2am*

          ---

          ### Summary

          | Field | Value |
          |-------|-------|
          | **Alert type** | \`${ALERT_TYPE}\` |
          | **Affected service** | \`${SERVICE}\` |
          | **Severity** | \`${SEVERITY}\` |
          | **Detection timestamp** | ${TIMESTAMP} |
          | **Run ID** | ${{ github.run_id }} |
          | **Triggered by** | @${{ github.actor }} |

          ---

          ### Correlation — Last Deployment

          - **SHA**: \`${{ steps.commits.outputs.last_commit }}\`
          - **Message**: ${{ steps.commits.outputs.last_commit_msg }}
          - **Author**: ${{ steps.commits.outputs.last_commit_author }}

          ---

          ### Diagnosis

          ${{ steps.diagnose.outputs.diagnosis }}

          **Probable root cause:** ${{ steps.diagnose.outputs.root_cause }}

          **Confidence level:** ${{ steps.diagnose.outputs.confidence }}

          ---

          ### Recommended Action

          **Type:** \`${{ steps.remediate.outputs.action_type }}\`

          ${{ steps.remediate.outputs.action }}

          **Urgency:** ${{ steps.remediate.outputs.urgency }}

          ---

          ### Resolution Checklist

          - [ ] Recommended action executed
          - [ ] Service returned to normal (metrics OK)
          - [ ] Root cause confirmed
          - [ ] Post-mortem scheduled
          - [ ] Runbook updated

          ---

          *Report generated by [incident-response.yml](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) — Agentic Incident Response*
          EOF
          )

          echo "Creating GitHub issue..."
          gh issue create \
            --title "[INCIDENT] ${ALERT_TYPE} on ${SERVICE} — ${TIMESTAMP}" \
            --body "$ISSUE_BODY" \
            --label "incident,production" \
            --repo ${{ github.repository }} || echo "Note: Labels 'incident' and 'production' need to be created if missing"

          echo "Incident report created automatically."
          echo "Thomas can keep sleeping. 😴"
