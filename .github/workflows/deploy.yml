name: Deploy — Thomas's Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ⚠️ BROKEN: Everything in a single job — no parallelism, no separation of concerns
  # lint, test, build, deploy all run sequentially like it's 2015
  build-and-deploy:
    runs-on: ubuntu-18.04  # ⚠️ BROKEN: Deprecated runner since 2023 — will stop working soon

    steps:
      - name: Checkout code
        uses: actions/checkout@v2  # ⚠️ BROKEN: Outdated action version

      - name: Setup Python
        uses: actions/setup-python@v2  # ⚠️ BROKEN: Outdated version
        with:
          python-version: 3.8  # ⚠️ BROKEN: Python 3.8 — EOL October 2024, no security support

      # 🐌 SLOW: No pip cache — re-downloads everything on each run (adds ~4 min)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r azure-insiders-demo/app/requirements.txt

      - name: Lint
        run: |
          pip install flake8
          flake8 azure-insiders-demo/app/ --max-line-length=120 || true  # ⚠️ BROKEN: errors silently ignored with || true

      - name: Run tests
        # ⚠️ BROKEN: Will fail because of the broken test in test_app.py (assert 999)
        run: |
          cd azure-insiders-demo
          pytest app/tests/ -v

      - name: Build Docker image
        # 🐌 SLOW: Docker build with no cache — restarts from scratch every time
        run: |
          echo "Building Docker image..."
          echo "No Dockerfile found — Thomas was going to add it 'later'"
          sleep 3  # 🐌 Simulating slow build

      - name: Security scan
        # ⚠️ BROKEN: No real security scan — Thomas "trusted the code"
        run: |
          echo "Skipping security scan — we'll look at that next week 😅"

      # ⚠️ BROKEN: needs: missing — if jobs were split, there would be a race condition
      - name: Deploy to production
        # 🐌 SLOW: Simulated manual deployment — in real life this takes 18 minutes
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying... fingers crossed 🤞"
          echo "Connecting to production server..."
          sleep 5  # 🐌 Simulating the 18-min deployment (reduced to 5s for the demo)
          echo "Deployment complete. Probably."
          echo "Thomas manually checks the site is responding... 🤞"
          echo "If it breaks, ask Jean-Claude (left the team March 2022)"
